<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a1733">
<title>Günlük Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap">
<style>
:root{--navy:#0a1733;--navy2:#0d1d42;--g1:#15854a;--g2:#22b45f;--ink:#f2f5fb;--mute:rgba(242,245,251,.5);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--navy);color:var(--ink);font-family:Outfit,Roboto,"Segoe UI",-apple-system,"Helvetica Neue",sans-serif;font-weight:500;-webkit-font-smoothing:antialiased}
.app{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,var(--navy2),var(--navy))}
.fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,var(--g2),var(--g1));transition:height 1s cubic-bezier(.2,.8,.2,1)}
.pages{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;height:100%;position:relative;scroll-snap-align:start;scroll-snap-stop:always}
.row{position:absolute;left:0;right:0;display:flex;justify-content:center;padding:0 60px;opacity:0;transform:translateY(-50%) scale(.97);transition:top .5s cubic-bezier(.3,.8,.2,1),opacity .35s,transform .35s}
.row.in{opacity:1;transform:translateY(-50%)}
.row.leaving{opacity:0;transform:translateY(-50%) scale(.95)}
.grp{display:flex;align-items:center;gap:16px;max-width:100%}
.txt{font-size:23px;font-weight:600;letter-spacing:0;line-height:1.3;text-align:center;min-width:2ch;outline:none;overflow-wrap:anywhere;caret-color:#fff;transition:opacity .3s}
.txt:empty::before{content:attr(data-ph);color:var(--mute)}
.chk{position:relative;flex:none;width:28px;height:28px;padding:0;border-radius:50%;border:1.5px solid rgba(255,255,255,.75);background:transparent;display:grid;place-items:center;transition:background .25s,border-color .25s}
.chk::after{content:"";position:absolute;inset:-10px}
.chk svg{width:16px;height:16px;fill:none;stroke:var(--navy);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:16;stroke-dashoffset:16;transition:stroke-dashoffset .3s .05s}
.row.done .chk{background:#fff;border-color:#fff}
.row.done .chk svg{stroke-dashoffset:0}
.row.done .txt{opacity:.55;text-decoration:line-through}
.x{position:absolute;right:10px;top:50%;width:44px;height:44px;margin-top:-22px;border:0;background:none;color:var(--ink);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .25s}
.x svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
body.del .x{opacity:.9;pointer-events:auto}
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 0}
.rg{display:flex;gap:2px}
.ib{width:46px;height:46px;border:0;border-radius:50%;background:none;color:var(--ink);display:grid;place-items:center;opacity:.8;transition:opacity .2s,background .2s,transform .15s,color .2s}
.ib:active{transform:scale(.92);background:rgba(255,255,255,.1)}
.ib svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ib.on{opacity:1;background:rgba(255,255,255,.16)}
.ib.dim{opacity:.25}
.ib.armed{color:#ffa0a0;opacity:1}
#tick.on{background:none}
#tick.on circle{fill:#fff;stroke:#fff}
#tick.on path{stroke:var(--navy)}
.msg{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--mute);font-size:18px;font-weight:600;letter-spacing:0;text-align:center;padding:0 24px;opacity:0;transition:opacity .6s .3s}
.msg.s{opacity:1}
.dots{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:4;display:flex;justify-content:center;gap:8px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3)}
.dots i.a{background:#fff}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 44px);z-index:6;max-width:88vw;padding:10px 18px;border-radius:999px;background:rgba(5,12,30,.78);color:var(--ink);font-size:14px;font-weight:600;text-align:center;opacity:0;transform:translate(-50%,10px);pointer-events:none;transition:opacity .3s,transform .3s}
.toast.s{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.fill,.row{transition-duration:.01s}}
</style>
</head>
<body>
<div class="app">
  <div class="fill" id="fill"></div>
  <div class="pages" id="pages"></div>
  <div class="msg" id="msg"></div>
</div>
<div class="top">
  <button class="ib" id="add" aria-label="Görev ekle"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <div class="rg">
    <button class="ib" id="clr" aria-label="Tüm görevleri temizle"><svg viewBox="0 0 24 24"><path d="M4 7h9M4 12h6M4 17h9M15.5 11l5 5M20.5 11l-5 5"/></svg></button>
    <button class="ib" id="del" aria-label="Görev silme modu"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6 7l1 13h10l1-13M10 11v5M14 11v5"/></svg></button>
    <button class="ib" id="tick" aria-label="Günü kilitle"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16 9.7"/></svg></button>
  </div>
</div>
<div class="dots" id="dots"></div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const pg=$('pages'),fill=$('fill'),msg=$('msg'),dots=$('dots'),toastEl=$('toast');
const bAdd=$('add'),bClr=$('clr'),bDel=$('del'),bTick=$('tick');
const KEY='gunluk-plan-v1',MAX=5;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const probe=document.createElement('div');probe.contentEditable='plaintext-only';
const EDIT=probe.contentEditable==='plaintext-only'?'plaintext-only':'true';
let S={date:today(),tasks:[],locked:false},delMode=false,armed=false,pend={},els={},armT,toastT,need=1;
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&r.date===today()){S=r;S.tasks=(S.tasks||[]).filter(t=>t.text&&t.text.trim())}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const find=id=>S.tasks.find(t=>t.id===id);
const real=()=>S.tasks.filter(t=>t.text.trim());
const visible=()=>S.tasks.filter(t=>!t.done||pend[t.id]);
const lockMsg=()=>'Bugün '+real().length+' görev eklendi. Daha fazla ekleyemezsin.';

function toast(m){toastEl.textContent=m;toastEl.classList.add('s');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('s'),2400)}

function mk(t){
  const r=document.createElement('div');r.className='row';r.dataset.id=t.id;
  r.innerHTML='<div class="grp"><button class="chk" aria-label="Tamamla"><svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg></button><div class="txt" data-ph="Bir görev ekle..." spellcheck="false"></div></div><button class="x" aria-label="Görevi sil"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
  const x=r.querySelector('.txt');x.setAttribute('contenteditable',EDIT);x.textContent=t.text;
  return r;
}
function trim(){while(pg.children.length>need&&!pg.lastChild.children.length)pg.lastChild.remove()}
function leave(id){const el=els[id];delete els[id];el.classList.remove('in');el.classList.add('leaving');setTimeout(()=>{el.remove();trim()},400)}
function updDots(){const a=Math.round(pg.scrollLeft/(pg.clientWidth||1));[...dots.children].forEach((d,i)=>d.classList.toggle('a',i===a))}

function render(){
  const vis=visible();need=Math.max(1,Math.ceil(vis.length/MAX));
  while(pg.children.length<need){const p=document.createElement('div');p.className='page';pg.appendChild(p)}
  const seen=new Set();
  vis.forEach((t,i)=>{
    const pi=Math.floor(i/MAX),k=i-pi*MAX,n=Math.min(MAX,vis.length-pi*MAX),page=pg.children[pi];
    let el=els[t.id];
    if(!el){el=els[t.id]=mk(t);el.style.top=((k+1)/(n+1)*100)+'%';page.appendChild(el);requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('in')))}
    else if(el.parentNode!==page)page.appendChild(el);
    el.style.top=((k+1)/(n+1)*100)+'%';
    el.classList.toggle('done',!!t.done);
    seen.add(t.id);
  });
  Object.keys(els).forEach(id=>{if(!seen.has(id))leave(id)});
  trim();
  const any=real().length>0;
  msg.textContent=any?'Görevler tamamlandı.':'Görev eklemek için + tuşuna bas';
  msg.classList.toggle('s',!vis.length);
  dots.innerHTML=need>1?'<i></i>'.repeat(need):'';updDots();
}
function progress(){
  const r=real(),d=r.filter(t=>t.done).length;
  fill.style.height=(r.length?d/r.length*100:0)+'%';
}
function ui(){bTick.classList.toggle('on',S.locked);bAdd.classList.toggle('dim',S.locked)}
function setDel(v){delMode=v&&visible().length>0;document.body.classList.toggle('del',delMode);bDel.classList.toggle('on',delMode)}
function disarm(){armed=false;clearTimeout(armT);bClr.classList.remove('armed')}

function toggle(id){
  const t=find(id);if(!t)return;
  t.done=!t.done;
  if(t.done)pend[id]=setTimeout(()=>{delete pend[id];render();setDel(delMode)},700);
  else{clearTimeout(pend[id]);delete pend[id]}
  save();render();progress();
}
function remove(id){
  clearTimeout(pend[id]);delete pend[id];
  S.tasks=S.tasks.filter(t=>t.id!==id);
  save();render();progress();setDel(delMode);
}

pg.addEventListener('click',e=>{
  const row=e.target.closest('.row');if(!row)return;
  if(e.target.closest('.chk'))toggle(row.dataset.id);
  else if(e.target.closest('.x'))remove(row.dataset.id);
});
pg.addEventListener('input',e=>{
  const row=e.target.closest('.row'),t=row&&find(row.dataset.id);if(!t)return;
  if(!e.target.textContent)e.target.innerHTML='';
  t.text=e.target.textContent;save();progress();
});
pg.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.classList.contains('txt')){e.preventDefault();e.target.blur()}
});
pg.addEventListener('focusout',e=>{
  if(!e.target.classList||!e.target.classList.contains('txt'))return;
  const row=e.target.closest('.row'),t=row&&find(row.dataset.id);if(!t)return;
  t.text=t.text.trim();
  if(!t.text)S.tasks=S.tasks.filter(x=>x!==t);
  save();render();progress();setDel(delMode);
});
pg.addEventListener('scroll',updDots,{passive:true});

bAdd.onclick=()=>{
  if(S.locked){toast(lockMsg());return}
  setDel(false);
  let t=S.tasks.find(x=>!x.text.trim());
  if(!t){t={id:uid(),text:'',done:false};S.tasks.push(t)}
  render();
  pg.scrollTo({left:Math.floor(visible().indexOf(t)/MAX)*pg.clientWidth});
  els[t.id].querySelector('.txt').focus();
};
bDel.onclick=()=>setDel(!delMode);
bTick.onclick=()=>{
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  if(!real().length){toast('Önce bir görev ekle');return}
  S.locked=true;save();ui();toast(lockMsg());
};
bClr.onclick=()=>{
  if(!S.tasks.length)return;
  if(!armed){armed=true;bClr.classList.add('armed');toast('Tekrar dokun: tüm görevler silinir');armT=setTimeout(disarm,2600);return}
  disarm();Object.values(pend).forEach(clearTimeout);pend={};
  S.tasks=[];S.locked=false;save();render();progress();ui();setDel(false);
};
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&S.date!==today()){
    Object.values(pend).forEach(clearTimeout);pend={};
    S={date:today(),tasks:[],locked:false};save();render();progress();ui();setDel(false);
  }
});

render();ui();
requestAnimationFrame(()=>requestAnimationFrame(progress));
})();
</script>
</body>
</html>
